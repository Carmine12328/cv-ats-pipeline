name: Feature Request
description: Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Is this related to a problem?
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives
  - type: checkboxes
    id: ats_compatibility
    attributes:
      label: ATS compatibility note
      options:
        - label: "This feature maintains single-column layout"
        - label: "This feature keeps skills as plain text"
        - label: "This feature doesn't add graphics or complex elements"
  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
