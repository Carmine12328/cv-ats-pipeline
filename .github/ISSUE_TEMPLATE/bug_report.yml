name: Bug Report
description: Report a build failure, rendering issue, or broken output
labels: [bug]
body:
  - type: textarea
    id: bug_description
    attributes:
      label: Describe the bug
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Node.js version
        - OS
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots/logs
    validations:
      required: false
  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
    validations:
      required: false
